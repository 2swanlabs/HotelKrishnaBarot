<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Krishna Barot Valley</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #0a160a;
        color: #eaeaea;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
        font-family: 'Inter', sans-serif;
    }

    .container {
        max-width: 700px;
        padding: 20px;
    }

    h1 {
        font-family: 'Playfair Display', serif;
        font-size: 2.6rem;
        font-weight: 600;
        letter-spacing: 1px;
        margin-bottom: 20px;
    }

    .launching {
        font-size: 0.9rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        opacity: 0.75;
        margin-bottom: 40px;
    }

    .loader {
        width: 200px;
        height: 2px;
        background: rgba(255,255,255,0.12);
        margin: 0 auto 40px;
        position: relative;
        overflow: hidden;
    }

    .loader::before {
        content: "";
        position: absolute;
        width: 35%;
        height: 100%;
        background: #ffffff;
        animation: slide 1.8s ease-in-out infinite;
    }

    @keyframes slide {
        0% { left: -35%; }
        60% { left: 100%; }
        100% { left: 100%; }
    }

    .tagline {
        font-size: 0.95rem;
        opacity: 0.6;
        margin-bottom: 12px;
    }

    .contact {
        font-size: 0.9rem;
        opacity: 0.85;
        letter-spacing: 0.5px;
    }

    .footer {
        position: absolute;
        bottom: 20px;
        font-size: 0.75rem;
        opacity: 0.5;
        letter-spacing: 0.5px;
    }

    .fade {
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 1.2s ease forwards;
    }

    .fade:nth-child(1) { animation-delay: 0.3s; }
    .fade:nth-child(2) { animation-delay: 0.6s; }
    .fade:nth-child(3) { animation-delay: 0.9s; }
    .fade:nth-child(4) { animation-delay: 1.2s; }

    @keyframes fadeUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
</head>

<body>

<div class="container">
    <h1 class="fade">Hotel Krishna Barot Valley</h1>
    <div class="launching fade">Website Launching Soon</div>

    <div class="loader fade"></div>

    <div class="tagline fade">
        Experience serenity in the lap of nature.
    </div>

    <div class="contact fade">
        Hotel Krishna: +91-9816387316
    </div>
</div>

<div class="footer">
    Website Designed & Maintained By 2Swan.in
</div>

</body>
</html>
