<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>2Swan.in — Chandigarh's Leading Web Developers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Outfit',sans-serif;
    background:#f5f5f3;
    overflow:hidden;
    color:#111111;

}

/* =========================
   BACKGROUND
========================= */

.bg{

    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top left, rgba(0,0,0,.025), transparent 35%),
    radial-gradient(circle at bottom right, rgba(0,0,0,.03), transparent 35%),
    #f5f5f3;

}

.grid{

    position:absolute;
    inset:0;

    background-image:
    linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px);

    background-size:70px 70px;

    opacity:.35;

    mask-image:radial-gradient(circle at center, black 35%, transparent 90%);

}

/* =========================
   HERO
========================= */

.hero{

    position:relative;
    z-index:5;

    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:40px;

}

.content{

    width:100%;
    max-width:1200px;

    text-align:center;

}

/* =========================
   LOGO
========================= */

.logo-wrap{

    width:120px;
    margin:0 auto 40px;

    position:relative;

}

.logo-wrap::before{

    content:'';

    position:absolute;

    inset:-30px;

    border-radius:50%;

    background:radial-gradient(circle, rgba(0,0,0,.06), transparent 70%);

    filter:blur(20px);

}

.logo-wrap img{

    width:100%;

    object-fit:contain;

    filter:
    drop-shadow(0 8px 20px rgba(0,0,0,.08));

    animation:float 4s ease-in-out infinite;

}

@keyframes float{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

}

/* =========================
   TAG
========================= */

.tag{

    display:inline-flex;
    align-items:center;
    gap:10px;

    padding:12px 20px;

    border-radius:999px;

    background:rgba(255,255,255,.7);

    border:1px solid rgba(0,0,0,.06);

    backdrop-filter:blur(10px);

    margin-bottom:34px;

}

.tag-dot{

    width:9px;
    height:9px;

    border-radius:50%;

    background:#111111;

    animation:pulse 1.8s infinite;

}

@keyframes pulse{

    0%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.7);
        opacity:.3;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

.tag span{

    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:600;

    color:#555;

}

/* =========================
   TITLE
========================= */

h1{

    font-size:90px;
    line-height:.92;

    letter-spacing:-6px;

    font-weight:800;

    color:#111111;

}

h1 span{

    color:#8b8b8b;

}

/* =========================
   SUBTEXT
========================= */

.desc{

    margin:34px auto 0;

    max-width:760px;

    font-size:21px;
    line-height:1.8;

    color:#5f5f5f;

    font-weight:400;

}

/* =========================
   BUTTONS
========================= */

.buttons{

    margin-top:50px;

    display:flex;
    justify-content:center;
    gap:18px;

    flex-wrap:wrap;

}

.btn{

    height:60px;

    padding:0 34px;

    border-radius:18px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    font-size:14px;
    font-weight:600;

    transition:.35s ease;

}

.btn-dark{

    background:#111111;
    color:white;

    box-shadow:
    0 18px 40px rgba(0,0,0,.08);

}

.btn-dark:hover{

    transform:translateY(-4px);

}

.btn-light{

    background:rgba(255,255,255,.75);

    color:#111111;

    border:1px solid rgba(0,0,0,.06);

    backdrop-filter:blur(12px);

}

.btn-light:hover{

    background:white;

}

/* =========================
   FLOATING MINIMAL ELEMENTS
========================= */

.float{

    position:absolute;

    border-radius:28px;

    background:rgba(255,255,255,.45);

    border:1px solid rgba(0,0,0,.05);

    backdrop-filter:blur(16px);

    box-shadow:
    0 18px 40px rgba(0,0,0,.04);

    animation:floatBox 6s ease-in-out infinite;

}

.float1{

    width:190px;
    height:190px;

    top:120px;
    left:100px;

}

.float2{

    width:120px;
    height:120px;

    right:160px;
    top:180px;

    animation-delay:1s;

}

.float3{

    width:260px;
    height:80px;

    left:180px;
    bottom:110px;

    animation-delay:2s;

}

.float4{

    width:180px;
    height:90px;

    right:190px;
    bottom:120px;

    animation-delay:1.5s;

}

@keyframes floatBox{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-14px);
    }

}

/* =========================
   FOOTER
========================= */

.footer{

    position:absolute;

    bottom:28px;
    left:50%;

    transform:translateX(-50%);

    font-size:13px;

    color:#8b8b8b;

    letter-spacing:1px;

}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

    h1{
        font-size:82px;
    }

}

@media(max-width:768px){

    body{
        overflow:auto;
    }

    .hero{
        min-height:100vh;
        height:auto;
    }

    h1{

        font-size:52px;
        letter-spacing:-3px;

    }

    .desc{

        font-size:17px;
        line-height:1.7;

    }

    .float{
        display:none;
    }

    .logo-wrap{
        width:95px;
    }

}

</style>
</head>

<body>

<div class="bg"></div>

<div class="grid"></div>

<!-- floating minimal shapes -->

<div class="float float1"></div>
<div class="float float2"></div>
<div class="float float3"></div>
<div class="float float4"></div>

<section class="hero">

    <div class="content">

        <!-- LOGO -->

        <!-- Replace logo.jpg with your actual file -->
        <div class="logo-wrap">

            <img src="logo.png" alt="2Swan Logo">

        </div>

        <!-- TAG -->

        <div class="tag">

            <div class="tag-dot"></div>

            <span>Premium Website Design & Development</span>

        </div>

        <!-- TITLE -->

        <h1>

            2<span>Swan</span>.in <br>

            Chandigarh’s Leading <br>

            Web Developers

        </h1>

        <!-- DESCRIPTION -->

        <div class="desc">

            Minimal. Modern. Premium websites crafted for businesses that want to stand out online.

        </div>

        <!-- BUTTONS -->

        <div class="buttons">

            <a href="#" class="btn btn-dark">

                Building Premium Experiences

            </a>

            <a href="#" class="btn btn-light">

                www.2Swan.in

            </a>

        </div>

    </div>

</section>

<div class="footer">

    © 2026 2Swan.in

</div>

</body>
</html>
